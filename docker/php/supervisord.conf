[supervisord]
nodaemon = true
logfile = /dev/null
logfile_maxbytes = 0
pidfile = /run/supervisord.pid

; apache2-foreground (fourni par l'image php) supprime le fichier PID avant de
; lancer Apache. Avec `apachectl -k start`, le PID resté dans le conteneur après
; un redémarrage faisait répondre « already running » : Apache ne démarrait
; plus (502), alors que cron et la file continuaient.
[program:apache2]
command = apache2-foreground
autostart = true
autorestart = true
priority = 10
redirect_stderr = true
stdout_logfile = /dev/fd/1
stdout_logfile_maxbytes = 0

[program:cron]
command = /start-cron.sh
stdout_logfile = /var/log/cron.log
stdout_logfile_maxbytes=0
stderr_logfile = /var/log/cron.log
stderr_logfile_maxbytes=0
user = root
autostart = true
autorestart = true
priority = 20

[program:queue-worker]
; --max-time : le worker se relance toutes les heures (supervisor le redémarre),
; filet de sécurité contre ce que le ramasse-miettes ne libérerait pas.
command=php artisan queue:work --max-time=3600
autostart = true
autorestart = true
priority = 30
redirect_stderr = true
stdout_logfile = /dev/fd/1
stdout_logfile_maxbytes = 0
